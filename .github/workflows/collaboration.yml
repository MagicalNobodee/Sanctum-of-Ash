name: collaboration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: collaboration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: work/package-lock.json
      - name: Check delivery record
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_collaboration.py --base "$BASE_SHA"
      - name: Test collaboration checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check LAN server syntax
        run: node --check lan-server.mjs
      - name: Install locked dependencies
        run: npm ci --prefix work
      - name: Test multiplayer watchdog
        run: node --test work/test_multiplayer_watchdog.mjs work/test_platform_runtime.mjs
      - name: Rebuild game and biome showcase
        run: |
          npm run build --prefix work
          npm run build:biomes --prefix work
      - name: Ensure generated files are committed
        run: git diff --exit-code -- SanctumOfAsh_3DRoguelike.html outputs/sanctum-of-ash.html outputs/biome-showcase.html
  platforms:
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Build on minimum supported Node.js
        run: |
          npm ci --prefix work
          npm run build --prefix work
          npm run build:biomes --prefix work
          git diff --exit-code -- SanctumOfAsh_3DRoguelike.html outputs/sanctum-of-ash.html outputs/biome-showcase.html
      - name: Test native runtime and multiplayer
        run: node --test work/test_platform_runtime.mjs work/test_multiplayer_watchdog.mjs
      - name: Install browser tests
        run: |
          python -m pip install -r work/requirements.txt
          python -m playwright install chromium
      - name: Test platform helpers
        run: python -m unittest discover -s work -p test_platform_support.py
      - name: Test offline game and two-player session (one browser)
        run: python work/test_platform_browser.py
